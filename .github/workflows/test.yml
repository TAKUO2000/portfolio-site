# バックエンドのテスト（Pest）。PR のたびに流し、デプロイのワークフロー（deploy.yml）からも呼び出して、
# テストが通ったコミットだけをデプロイする
name: Test backend

on:
  pull_request:
    branches: [develop, main]
    paths:
      - laravel-back/**
      - .github/workflows/test.yml
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # 本番と同じ版。phpunit.xml は DB_DATABASE を laravel_back_testing に固定している
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_back_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
    defaults:
      run:
        working-directory: laravel-back
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          # Dockerfile.prod と同じ拡張
          extensions: pdo_mysql, gd, zip, intl, bcmath, exif, pcntl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
