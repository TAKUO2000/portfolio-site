name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          show_full_output: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude"
          prompt: |
            このPRの差分をレビューしてください。
            観点: バグ、セキュリティ上の問題、可読性、命名、テスト不足。
            指摘は具体的に、修正案つきで。重大度（critical/warning/nit）を付けてください。
            各指摘は mcp__github_inline_comment__create_inline_comment で該当行に
            インラインコメントとして投稿し、総評は `gh pr comment` でPRに投稿してください。
            問題が無ければ `gh pr comment` で「LGTM」とだけ投稿してください。
          claude_args: |
            --max-turns 100
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"
