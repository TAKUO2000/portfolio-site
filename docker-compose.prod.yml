# 本番（とステージング）の EC2 で動かす構成。infra/design.md の「EC2 上のコンテナ構成」
#
# 環境変数は、同じディレクトリの .env.production（パーミッション 600、リポジトリには入れない）から読む。
# 雛形は laravel-back/.env.production.example。compose の変数の置き換えにも使うので、毎回 --env-file で渡す:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d

# ログがルートの EBS を埋めないよう、コンテナごとに 10MB × 3 世代までにする
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE に ECR のイメージ（<リポジトリの URL>:main-<SHA>）を指定してください}
  restart: unless-stopped
  env_file:
    - .env.production
  depends_on:
    mysql:
      condition: service_healthy
  logging: *logging

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # 1GB のインスタンスに収めるため、バッファプールを小さくし、performance_schema を切る
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    # ポートはホストに公開しない（app と scheduler からだけ、compose のネットワークで使う）
    volumes:
      # データ用 EBS（/data）に置き、インスタンスを作り直しても残す
      - ${MYSQL_DATA_DIR:-/data/mysql}:/var/lib/mysql
    healthcheck:
      # ping は認証に失敗しても、サーバーが動いていれば成功を返す。パスワードをコマンドに書かずに済む。
      # TCP で確かめる（初回の初期化中はネットワークを閉じた一時サーバーが動くので、ソケットだと早く成功してしまう）
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  app:
    <<: *app

  # schedule:work で images:prune などを動かす。マイグレーションは app でだけ流す（entrypoint.prod.sh）
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # prod.conf の ${API_DOMAIN} を置き換える（api.takuosblog.com / api.stg.takuosblog.com）
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN に API のドメインを指定してください}
    volumes:
      - ./laravel-back/docker/nginx/prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ${LETSENCRYPT_DIR:-/data/letsencrypt}:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - app
    logging: *logging

  # 証明書の取得と更新のときだけ docker compose run --rm certbot ... で動かす（常駐させない）
  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    volumes:
      - ${LETSENCRYPT_DIR:-/data/letsencrypt}:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    logging: *logging

volumes:
  certbot_webroot:
