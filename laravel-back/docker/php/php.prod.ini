; php.ini-production に重ねる本番用の設定

; 応答ヘッダー（X-Powered-By）に PHP のバージョンを出さない
expose_php = Off

upload_max_filesize = 10M
post_max_size = 12M
; 画像の加工はしないので、API には 128M で足りる。pm.max_children 5 と掛けても 640M に収まる
memory_limit = 128M

; コードはイメージに焼き込み、変えるときはコンテナを入れ替えるので、ファイルの更新を確かめない
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 20000

realpath_cache_size = 4096K
realpath_cache_ttl = 600
