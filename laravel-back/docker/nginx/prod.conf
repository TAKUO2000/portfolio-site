# 本番用の設定。docker-compose.prod.yml で /etc/nginx/templates/default.conf.template として読み込み、
# nginx の起動時に ${API_DOMAIN} を環境変数の値に置き換える（nginx の公式イメージの機能）。
# 置き換わるのは定義されている環境変数だけなので、$host などの nginx の変数はそのまま残る

# 応答ヘッダー（Server）に nginx のバージョンを出さない
server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name ${API_DOMAIN};

    # Let's Encrypt の HTTP-01 の確認だけは HTTP で返す（certbot が webroot に置いたファイル）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${API_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${API_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${API_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 12M;

    # API サーバーで配信する静的ファイルは無い（画像は S3）ので、すべてのリクエストを index.php に渡す。
    # nginx のコンテナにはソースを置かない。index.php 以外の .php は実行させない
    location / {
        # app コンテナを作り直すと IP が変わるため、Docker の内部 DNS で都度解決する
        # (fastcgi_pass に変数を使うと起動時解決ではなくリクエスト時解決になる)
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream app:9000;
        fastcgi_pass $upstream;

        # fastcgi_params の HTTPS=on で、Laravel が https と判定する（外すと署名付き URL の検証が失敗する）
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;

        # 応答ヘッダーに PHP のバージョンを出さない（php.ini の expose_php = Off と二重に止める）
        fastcgi_hide_header X-Powered-By;
    }
}
